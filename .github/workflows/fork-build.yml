name: "Fork Build"

# Fork-only convenience build: unsigned installers for this fork's branches so
# they can be handed to someone without a build toolchain (and so a machine
# short on disk doesn't have to build Tauri locally).
# Signing is off because the code-signing secrets live in the upstream repo.

on:
  push:
    branches: [feat/deepgram-cloud-stt, feat/deepgram-flux]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --target puts the bundle under target/<triple>/, which is where the
          # macOS artifact upload looks; without it no DMG was ever uploaded.
          # macos-26 carries the SDK for Apple Intelligence, as in release.yml.
          - platform: "macos-26"
            target: "aarch64-apple-darwin"
            build-args: "--target aarch64-apple-darwin"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            build-args: ""
          # AppImage runs on any x86_64 distro, including Arch/CachyOS.
          - platform: "ubuntu-24.04"
            target: "x86_64-unknown-linux-gnu"
            build-args: "--bundles appimage"
    # Must match the reusable workflow's own `contents: write` — a called
    # workflow cannot be granted more than its caller holds, and anything less
    # fails the run at startup.
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.build-args }}
      upload-artifacts: true
      sign-binaries: false
    secrets: inherit

  # Publishes the installers to a rolling prerelease so they can be linked
  # to directly, instead of living in an artifact that expires in 30 days and
  # needs a GitHub login to download.
  release:
    needs: build
    if: github.ref == 'refs/heads/feat/deepgram-flux'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect installers
        id: collect
        run: |
          mkdir -p release
          # -print -quit keeps this failing loudly if the bundle layout moves,
          # rather than publishing an empty release.
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' \) \
            -exec cp {} release/ \;
          if [ -z "$(ls -A release)" ]; then
            echo "No installers found in artifacts:" >&2
            find artifacts -type f >&2
            exit 1
          fi
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="flux-latest"
          # A rolling tag has to be moved, and `gh release edit` cannot retarget
          # an existing tag, so the release is replaced wholesale each run.
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" release/* \
            --title "Flux build (rolling)" \
            --notes "Automatic build of \`feat/deepgram-flux\` at ${GITHUB_SHA:0:7}.

          Unsigned. Windows SmartScreen warns: **More info -> Run anyway**. macOS blocks the
          first launch: right-click -> Open. Linux: \`chmod +x\` the AppImage and run it.

          Rebuilt on every push to the branch; the download link stays the same." \
            --prerelease \
            --target "$GITHUB_SHA"
