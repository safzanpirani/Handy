name: "Windows Fork Build"

# Fork-only convenience build: produces an unsigned Windows x64 installer for
# this branch so it can be handed to someone without a build toolchain.
# Signing is off because the code-signing secrets live in the upstream repo.

on:
  push:
    branches: [feat/deepgram-cloud-stt]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # Must match the reusable workflow's own `contents: write` — a called
    # workflow cannot be granted more than its caller holds, and anything less
    # fails the run at startup.
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "windows-latest"
      target: "x86_64-pc-windows-msvc"
      build-args: ""
      upload-artifacts: true
      sign-binaries: false
    secrets: inherit
